name: Frontend controleren en verpakken
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Thema controleren en release maken
        shell: pwsh
        run: ./scripts/build-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
